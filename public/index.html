<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sustainability Advisory Committee Home Page">
    <meta name="author" content="Angella Howard, Leia Richards, Conor Fitzgerald, Jake Cunningham">

    <title>Sustainability Advisory Committee Home Page</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <a class="logo-text">
            <img class="logo" alt="Logo">
            <span class="logo-name"></span>
        </a>
        <input type="checkbox" id="hamburger">
        <label for="hamburger" class="hambtn">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav>
            <ul class="topnav">
                <li class="dropdown">
                    <button class="dropbtn"></button>
                    <div class="dropdown-goals"></div>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="banner-section">
            <div class="banner">
            </div>
            <div class="banner-image">
                <img class="image"></img>
            </div>
        </section>

        <section class="text-section">
        </section>

        <section class="goals-section">
            <article class="goal1">
            </article>
            <article class="goal2">
            </article>
            <article class="goal3">
            </article>
        </section>

        <footer>
            <section class="footertop">
                <h3 class="footer-title"></h3>
                <ul class="footer-links">
                </ul>
            </section>
            <section class="footerbottom">
            </section>
        </footer>
    </main>
    <script src="js/main.js"></script>

</body>

</html>
