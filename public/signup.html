    <link rel="stylesheet" href="css/signup.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <header>
        <a class="logo-text">
            <img class="logo" alt="Logo">
            <span class="logo-name"></span>
        </a>
        <input type="checkbox" id="hamburger">
        <label for="hamburger" class="hambtn">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav>
            <ul class="topnav">
                <li class="dropdown">
                    <button class="dropbtn"></button>
                    <div class="dropdown-goals"></div>
                </li>
                <li class="nav-link"></li>
                <li class="nav-link"></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="text-section">
            <h2></h2>
            <p></p>

            <form id="signupForm" novalidate>
                <label for="firstName"></label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName"></label>
                <input type="text" id="lastName" name="lastName" required>

                <label for="email"></label>
                <input type="email" id="email" name="email" required>

                <label for="comments"></label>
                <textarea id="comments" name="comments" rows="4"></textarea>

                <button type="submit"></button>
            <p>Sign up to receive any updates and news about our goals.</p>

            <form id="signupForm" novalidate>
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="comments">Message (optional):</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Say here why you chose to sign up..."></textarea>

                <button type="submit">Submit</button>

                <p id="responseMessage"></p>
            </form>
        </section>

         <footer>
            <section class="footertop">
                <h3 class="footer-title"></h3>
                <ul class="footer-links">
                </ul>
            </section>
            <section class="footerbottom">
            <section class="footertop">
                <h3 class="footer-title"></h3>
                <ul class="footer-links">
                </ul>
            </section>
            <section class="footerbottom">

            </section>
        </footer>
