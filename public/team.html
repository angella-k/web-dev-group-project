<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sustainability Advisory Committee Team Page">
    <meta name="author" content="Angella Howard, Leia Richards, Conor Fitzgerald, Jake Cunningham">

    <title>Sustainability Advisory Committee Team Page</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/team.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <a class="logo-text">
            <img class="logo" alt="Logo">
            <span class="logo-name"></span>
        </a>
        <input type="checkbox" id="hamburger">
        <label for="hamburger" class="hambtn">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav>
            <ul class="topnav">
                <li class="dropdown">
                    <button class="dropbtn"></button>
                    <div class="dropdown-goals"></div>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="banner-section">
            <h1></h1>
            <img class="banner-image" alt="">
            <button class="banner-button" onclick="location.href='#team'"></button>
        </section>

        <section class="content-section-1">
            <h2></h2>
            <p></p>
        </section>

        <section class="content-section-2" id = "team">
            <h2></h2>
            <div class="team-grid"></div>
        </section>

        <section class="signup-section">
            <div class="signup-box">
                <div class="signup-content">
                    <h2></h2>
                    <p></p>
                </div>
                <button class="signup-button"></button>
            </div>
        </section>

        <section class="resources-section">
            <div class="resources-grid">
                <div class="resources-content">
                    <h2></h2>
                    <p></p>
                    <button class="resources-button"></button>
                </div>
                <img class="resources-image" alt="">
            </div>
        </section>
    </main>

    <footer>
        <section class="footertop">
            <h3 class="footer-title"></h3>
            <ul class="footer-links"></ul>
        </section>
        <section class="footerbottom"></section>
    </footer>
    
    <script src="js/main.js"></script>

</body>

</html>
